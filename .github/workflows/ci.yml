name: CI - Build and Smoke Test

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: k6_books
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: ./api

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg2
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Build Docker images
        run: |
          docker build -t k6-api:latest ./api
          docker build -t k6-frontend:latest ./frontend

      - name: Start Docker Compose services
        run: |
          docker-compose up -d postgres api frontend
          sleep 10  # Wait for services to be ready

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API health check failed"
          exit 1

      - name: Run k6 smoke test
        run: k6 run --vus 2 --duration 30s k6/scenarios/smoke.js
        env:
          API_URL: http://localhost:3000
          FRONTEND_URL: http://localhost:8080

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test_results.json
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker-compose down
